server:
  port: 8081

spring:
  application:
    name: sample-app-a
  security:
    oauth2:
      client:
        registration:
          mini-sso:
            client-id: sample-app-a
            client-secret: ${SAMPLE_APP_A_SECRET:local-sample-app-a-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          mini-sso:
            # 기동 시 OIDC Discovery 문서를 조회하므로 인증 서버를 먼저 실행해야 한다
            issuer-uri: ${MINISSO_ISSUER_URI:http://localhost:9000}
            user-name-attribute: sub

# 로그인한 사용자의 액세스 토큰으로 호출할 샘플 앱 B (SDK로 보호되는 API)
sample:
  app-b-url: ${SAMPLE_APP_B_URL:http://127.0.0.1:8082}
