[versions]
kotlin = "2.1.21"
spring-boot = "3.5.6"
archunit = "1.3.0"
querydsl = "5.1.0"
bouncycastle = "1.80"
# Spring Boot BOM이 관리하지 않으므로 직접 지정한다. Spring Security가 더 높은 버전을 가져오면 Gradle이 높은 쪽으로 맞춘다.
nimbus-jose-jwt = "9.37.3"
# Spring Boot 3.5.6 BOM은 1.21.3을 가져오는데, 이 버전은 Docker Engine 29의 최소 API 버전(1.44)을 맞추지 못해
# 통합 테스트가 "Could not find a valid Docker environment"로 실패한다. 1.21.4부터 최신 Docker Engine을 지원한다.
# 통합 테스트 규약(minisso.integration-test-conventions)에서 BOM으로 적용한다. Spring Boot BOM과 겹치면 Gradle이 높은 쪽을 고른다.
testcontainers = "1.21.4"

[libraries]
# build-logic 전용 (Gradle 플러그인)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

# 애플리케이션 (Spring Boot BOM이 관리하지 않는 것만 버전 명시)
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
