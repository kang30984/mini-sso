# GitHub에서도 커밋마다 빌드 결과를 확인하기 위한 워크플로 (주 파이프라인은 .gitlab-ci.yml)
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # --continue: 한 모듈이 실패해도 나머지 모듈을 계속 빌드해 모든 오류를 한 번에 확인
      - run: ./gradlew build --continue
