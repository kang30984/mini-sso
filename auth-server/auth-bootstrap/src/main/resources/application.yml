server:
  port: 9000

spring:
  application:
    name: mini-sso
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minisso}
    username: ${DB_USERNAME:minisso}
    password: ${DB_PASSWORD:minisso-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리하고, Hibernate는 엔티티와 일치하는지만 검증
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

minisso:
  account:
    max-failed-attempts: 5
    lock-duration: 30m
    password-max-age: 90d

management:
  endpoints:
    web:
      exposure:
        include: health, info
