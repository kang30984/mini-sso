server:
  port: 9000

spring:
  application:
    name: mini-sso
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minisso}
    username: ${DB_USERNAME:minisso}
    password: ${DB_PASSWORD:minisso-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health, info
