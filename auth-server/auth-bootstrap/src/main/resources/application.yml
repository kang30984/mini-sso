server:
  port: 9000

spring:
  application:
    name: mini-sso
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minisso}
    username: ${DB_USERNAME:minisso}
    password: ${DB_PASSWORD:minisso-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리하고, Hibernate는 엔티티와 일치하는지만 검증
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 로그인(SSO) 세션을 Redis에 저장한다 (Spring Session). 마지막 요청 후 8시간 동안 유지된다.
  session:
    timeout: 8h
    redis:
      namespace: minisso:session

minisso:
  # 토큰의 iss 클레임. 비워두면 요청 호스트로 결정되므로 운영에서는 반드시 지정한다.
  issuer-uri: ${MINISSO_ISSUER_URI:}
  account:
    max-failed-attempts: 5
    lock-duration: 30m
    password-max-age: 90d

management:
  endpoints:
    web:
      exposure:
        include: health, info
